name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # enables "Run workflow" button in GitHub Actions UI

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js setup ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Root workspace install (api + web + shared) ────────────────────
      - name: Install root workspace dependencies
        run: npm ci

      # ── 4. Build shared package first (api & web depend on dist/) ─────────
      - name: Build @poc/shared
        run: npm run build --workspace=packages/shared

      # ── 5. Build NestJS API ───────────────────────────────────────────────
      - name: Build NestJS API
        run: npm run build --workspace=apps/api

      # ── 6. Build Next.js frontend ─────────────────────────────────────────
      - name: Build Next.js frontend
        run: npm run build --workspace=apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:3000

      # ── 7. Lint NestJS API ────────────────────────────────────────────────
      - name: Lint NestJS API
        run: npm run lint --workspace=apps/api

      # ── 8. Playwright setup ───────────────────────────────────────────────
      - name: Install Playwright dependencies
        working-directory: playwright-template
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright-template
        run: npx playwright install --with-deps chromium

      # ── 9. Run Playwright tests (strict — failures will fail the job) ─────
      - name: Run Playwright smoke tests
        working-directory: playwright-template
        run: npx playwright test --reporter=html
        env:
          CI: true

      # ── 10. Upload Playwright HTML report ─────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-template/playwright-report/
          retention-days: 14
